<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:'InterTile';font-weight:600;src:local('Inter SemiBold'),local('Inter 18pt SemiBold'),url('../../../shared/fonts/Inter_18pt-SemiBold.ttf')}
html,body{margin:0;width:640px;height:360px;overflow:hidden}
body{position:relative;background:linear-gradient(180deg,#1C1C21 0%,#18181C 100%);font-family:'InterTile','Inter',sans-serif}
svg.icon{position:absolute;left:0;top:0;width:640px;height:360px}
.label{position:absolute;left:0;top:219px;width:640px;height:72px;text-align:center;font-size:60px;line-height:72px;font-weight:600;color:#F5F5F7;letter-spacing:-0.01em;white-space:nowrap}
</style></head><body>
<svg class="icon" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
<!-- Знак контраста: круг с залитой левой половиной. Центр на 320 по горизонтали и 132 по вертикали, как значок у «Звука», «Ночного режима» и «Сторожа» -->
<circle cx="320" cy="132" r="64" fill="none" stroke="#5ED3B4" stroke-width="12"/>
<path d="M320 68 A64 64 0 0 0 320 196 Z" fill="#5ED3B4"/>
</svg>
<div class="label">Картинка</div>
</body></html>
