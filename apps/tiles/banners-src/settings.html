<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:640px;height:360px;overflow:hidden}
body{position:relative;background:linear-gradient(180deg,#1C1C21 0%,#18181C 100%);font-family:'Inter',sans-serif}
.frame{position:absolute;left:2px;top:2px;width:636px;height:356px;box-sizing:border-box;border:2px solid rgba(255,255,255,0.14);border-radius:28px}
svg.icon{position:absolute;left:0;top:0;width:640px;height:360px}
.label{position:absolute;left:0;top:219px;width:640px;height:72px;text-align:center;font-size:60px;line-height:72px;font-weight:600;color:#F5F5F7;letter-spacing:-0.01em;white-space:nowrap}
</style></head><body>
<svg class="icon" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F3F7"/><stop offset="1" stop-color="#A3A9B7"/></linearGradient>
 <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<g transform="translate(320,132)" filter="url(#s)">
 <g fill="url(#g)">
  <circle r="44"/>
  <rect x="-11" y="-62" width="22" height="26" rx="5" transform="rotate(0)"/>
  <rect x="-11" y="-62" width="22" height="26" rx="5" transform="rotate(45)"/>
  <rect x="-11" y="-62" width="22" height="26" rx="5" transform="rotate(90)"/>
  <rect x="-11" y="-62" width="22" height="26" rx="5" transform="rotate(135)"/>
  <rect x="-11" y="-62" width="22" height="26" rx="5" transform="rotate(180)"/>
  <rect x="-11" y="-62" width="22" height="26" rx="5" transform="rotate(225)"/>
  <rect x="-11" y="-62" width="22" height="26" rx="5" transform="rotate(270)"/>
  <rect x="-11" y="-62" width="22" height="26" rx="5" transform="rotate(315)"/>
 </g>
 <circle r="17" fill="#1B1B20"/>
</g>
</svg>
<div class="label">Настройки</div>
</body></html>
