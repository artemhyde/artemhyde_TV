<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0d1426}
body{position:relative;font-family:'Inter',sans-serif}
#bg{position:absolute;left:0;top:0;width:1920px;height:1080px}
/* Ряд: левый край 60px, промежуток 24px. Плитка 268x150.75 (16:9), фокусная 1.35x = 361.8x203.6.
   Фокусная имеет реальный увеличенный размер (не transform), поэтому гэп до VK ровно 24px
   и обводка ровно 3px. Правый край ряда = 60+361.8+24+5*268+4*24 = 1881.8 (запас 38px). */
.row{position:absolute;left:60px;top:398.2px;height:203.6px;display:flex;align-items:center;gap:24px}
.t{flex:none;width:268px;height:150.75px;border-radius:14px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.t img{display:block;width:100%;height:100%}
.row .focus{width:361.8px;height:203.6px;border-radius:18.9px;box-shadow:0 0 0 3px #fff,0 26px 60px rgba(0,0,0,.6);position:relative;z-index:5}
.night{position:absolute;left:60px;top:650px}
</style></head><body>
<svg id="bg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#0c1428"/>
   <stop offset="0.32" stop-color="#1f2b4a"/>
   <stop offset="0.52" stop-color="#4a4a62"/>
   <stop offset="0.64" stop-color="#7d5f5b"/>
   <stop offset="0.72" stop-color="#8a6552"/>
   <stop offset="1" stop-color="#3a2a28"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
   <stop offset="0" stop-color="#d7a77a" stop-opacity="0.38"/>
   <stop offset="1" stop-color="#d7a77a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="d1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a4140"/><stop offset="1" stop-color="#2e2123"/></linearGradient>
  <linearGradient id="d2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f2e30"/><stop offset="1" stop-color="#1f171b"/></linearGradient>
  <linearGradient id="d3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2024"/><stop offset="1" stop-color="#151014"/></linearGradient>
 </defs>
 <rect width="1920" height="1080" fill="url(#sky)"/>
 <ellipse cx="1180" cy="700" rx="900" ry="220" fill="url(#glow)"/>
 <g id="stars" fill="#fff"></g>
 <path d="M0 720 C260 660 520 700 800 735 C1080 770 1360 690 1640 700 C1780 705 1860 725 1920 745 V1080 H0 Z" fill="url(#d1)"/>
 <path d="M0 830 C220 790 470 830 760 850 C1060 872 1330 800 1620 815 C1760 822 1850 840 1920 860 V1080 H0 Z" fill="url(#d2)"/>
 <path d="M0 950 C300 915 560 955 900 962 C1250 969 1560 925 1920 960 V1080 H0 Z" fill="url(#d3)"/>
</svg>

<div class="row">
 <div class="t focus"><img src="browser.png"></div>
 <div class="t"><img src="vk.png"></div>
 <div class="t"><img src="youtube.png"></div>
 <div class="t"><img src="lampa.png"></div>
 <div class="t"><img src="files.png"></div>
 <div class="t"><img src="twitch.png"></div>
</div>
<div class="t night"><img src="night.png"></div>

<script>
var s=document.getElementById('stars'),seed=7,r=function(){seed=(seed*16807)%2147483647;return seed/2147483647};
for(var i=0;i<90;i++){var y=r()*520,x=r()*1920,c=document.createElementNS('http://www.w3.org/2000/svg','circle');
 c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',(0.6+r()*1.1).toFixed(2));
 c.setAttribute('opacity',(0.15+r()*0.5*(1-y/620)).toFixed(2));s.appendChild(c)}
</script>
</body></html>
